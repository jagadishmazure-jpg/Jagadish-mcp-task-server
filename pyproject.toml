[project]
name = "mcp-task-server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.4,<4",
    "langchain>=1.4.8",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.7.3",
    "langgraph>=1.2.19",
    "mcp>=1.24,<2",
    "pydantic>=2.14.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
